name: Temporary map contour analysis
on:
  push:
    paths:
      - ".github/workflows/map-contours.yml"
  workflow_dispatch:
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Analyze yellow building outlines
        run: |
          python -m pip install --quiet pillow opencv-python-headless numpy
          python - <<'PY'
          from PIL import Image
          import numpy as np, cv2
          p = "webapp/Спутниковая карта строительного комплекса.png"
          im = Image.open(p).convert("RGB")
          a = np.array(im)
          print("IMAGE_SIZE", im.size)
          r,g,b = a[:,:,0],a[:,:,1],a[:,:,2]
          mask = ((r > 145) & (g > 105) & (b < 135) & (r > g*1.08) & (g > b*1.12)).astype("uint8")*255
          print("YELLOW_PIXELS", int(mask.sum()/255))
          n, labels, stats, cents = cv2.connectedComponentsWithStats(mask, 8)
          comps=[]
          for i in range(1,n):
            x,y,w,h,area = stats[i]
            if area >= 20:
              comps.append((int(area),int(x),int(y),int(w),int(h)))
          print("COMPONENTS_TOP", sorted(comps, reverse=True)[:80])
          contours,_ = cv2.findContours(mask, cv2.RETR_EXTERNAL, cv2.CHAIN_APPROX_SIMPLE)
          polys=[]
          for c in contours:
            area=cv2.contourArea(c)
            if area < 150: continue
            eps=max(2.0,0.004*cv2.arcLength(c,True))
            approx=cv2.approxPolyDP(c,eps,True).reshape(-1,2)
            if len(approx)>30:
              approx=cv2.approxPolyDP(c,0.01*cv2.arcLength(c,True),True).reshape(-1,2)
            polys.append((round(float(area),1),approx.tolist()))
          print("CONTOURS", sorted(polys,key=lambda z:z[0],reverse=True)[:30])
          PY